<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK 发版</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">APK 发版</div>
  <div class="meta">
    <span id="repo-badge" class="badge">加载中…</span>
    <span id="token-badge" class="badge">加载中…</span>
  </div>
</header>

<main>

  <!-- ── 第一步：拖入 APK ─────────────────────────────────── -->
  <section class="card">
    <div id="dropzone" class="dropzone" tabindex="0">
      <div class="dz-icon">📦</div>
      <div class="dz-title">把 APK 拖到这里</div>
      <div class="dz-sub">或点击选择文件 · 会自动读出包名与版本号，不用手填</div>
      <input id="file-input" type="file" accept=".apk" hidden>
    </div>
    <div id="inspect-status" class="status hidden"></div>
  </section>

  <!-- ── 第二步：确认信息 ─────────────────────────────────── -->
  <section id="step-review" class="card hidden">
    <h2>确认信息</h2>

    <dl class="kv">
      <dt>文件</dt><dd id="r-file"></dd>
      <dt>包名 packageName</dt><dd id="r-package" class="mono"></dd>
      <dt>APK 内 versionName</dt><dd id="r-versionname" class="mono"></dd>
      <dt>将要生成的 tag</dt><dd id="r-tag" class="mono strong"></dd>
      <dt>上传的附件名</dt><dd id="r-asset" class="mono"></dd>
      <dt>文件大小</dt><dd id="r-size"></dd>
      <dt>MD5</dt><dd id="r-md5" class="mono"></dd>
    </dl>

    <h3>规范自检</h3>
    <ul id="r-checks" class="checks"></ul>

    <h3>发布设置</h3>

    <div class="field">
      <label>版本类型</label>
      <div class="radios">
        <label class="radio">
          <input type="radio" name="kind" value="prod" checked>
          <span>正式版<em>标记为 Latest，门市正式环境会推送它</em></span>
        </label>
        <label class="radio">
          <input type="radio" name="kind" value="test">
          <span>测试版<em>pre-release，不占用 Latest 通道</em></span>
        </label>
      </div>
    </div>

    <div class="field">
      <label for="changelog">更新说明 <span class="req">必填</span></label>
      <textarea id="changelog" rows="5" placeholder="例如：&#10;1. 修复弱网环境下重连失败的问题&#10;2. 优化结算页加载速度"></textarea>
      <div class="hint">这段文字会写进 Release 正文，直接显示在车机/终端的更新提示弹窗里。</div>
    </div>

    <div class="field">
      <label for="appname">应用显示名</label>
      <input id="appname" type="text">
    </div>

    <div id="publish-note" class="note hidden"></div>

    <div class="actions">
      <button id="btn-publish" class="btn primary">发布到 GitHub</button>
      <button id="btn-dryrun" class="btn">演练（不真正发布）</button>
      <button id="btn-reset" class="btn ghost">重新选择</button>
    </div>
  </section>

  <!-- ── 第三步：结果 ─────────────────────────────────────── -->
  <section id="step-result" class="card hidden"></section>

  <!-- ── 自检：第三方会抓到什么 ───────────────────────────── -->
  <section class="card">
    <h2>线上最新版自检</h2>
    <p class="hint">用第三方平台的方式回读一次 <code>/releases/latest</code>，确认它们能抓到什么。</p>
    <div class="actions">
      <button id="check-latest" class="btn">检查线上最新版</button>
    </div>
    <div id="latest-result"></div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>
<script src="/js/app.js" type="module"></script>
</body>
</html>
